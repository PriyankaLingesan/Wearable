   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #333333" x="396" y="17.127949" transform="rotate(-0 396 17.127949)">Wrist unit wiring reference (PROPOSED, NOT BUILT, NOT TESTED)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #8a5a00" x="396" y="35.606672" transform="rotate(-0 396 35.606672)">Only compile, boot and the camera-probe failure were run, on a Wokwi XIAO ESP32-S3 with OLED, button and LED (Wokwi has no camera part).</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2f5d8c" x="248.4" y="66.774516" transform="rotate(-0 248.4 66.774516)">Seeed XIAO ESP32S3 Sense (ESP32-S3R8, 8 MB PSRAM)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="392.4" y="115.898789" transform="rotate(-0 392.4 115.898789)">Camera on the Sense expansion board</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="392.4" y="124.454789" transform="rotate(-0 392.4 124.454789)">proposed OV5640 AF (vendor: OV5640 or OV3660 may ship)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="392.4" y="133.010789" transform="rotate(-0 392.4 133.010789)">board-to-board connector: NO external wiring</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="392.4" y="141.566547" transform="rotate(-0 392.4 141.566547)">XCLK 10  PCLK 13  VSYNC 38  HREF 47</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="392.4" y="150.122547" transform="rotate(-0 392.4 150.122547)">Data 15, 17, 18, 16, 14, 12, 11, 48   SCCB SDA 40 / SCL 39</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="392.4" y="217.018828" transform="rotate(-0 392.4 217.018828)">Camera, microphone and microSD GPIOs are used by the board.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="392.4" y="225.298828" transform="rotate(-0 392.4 225.298828)">D8-D10 share the SD pins and are left unused.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="392.4" y="295.852711" transform="rotate(-0 392.4 295.852711)">Firmware (about 80 lines)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="392.4" y="304.960711" transform="rotate(-0 392.4 304.960711)">button -&gt; LED on -&gt; JPEG frame -&gt; HTTP POST</text>
   </g>
   <g id="text_13">
