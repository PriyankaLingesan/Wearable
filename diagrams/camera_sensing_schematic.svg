   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #8a6a10" transform="translate(38.020391 217.195352)">White LED illumination</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #8a6a10" transform="translate(6.260273 227.397676)">(2 x LED, oblique, ~30–40° from axis;</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #8a6a10" transform="translate(13.536406 237.6)">not a sensor; GPIO1/D0 via driver)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #8a6a10" transform="translate(618.740828 325.915516)">Glare control: oblique, diffuse light;</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #8a6a10" transform="translate(621.245031 335.757758)">recapture hint “glare” if saturated</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #8a6a10" transform="translate(651.922641 345.6)">region on the mark</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="640.8" y="158.4" transform="rotate(-0 640.8 158.4)">XIAO ESP32S3 Sense</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(595.884375 172.557813)">DVP camera interface,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(603.581875 182.16)">JPEG encode, Wi-Fi</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="457.2" y="156.24" transform="rotate(-0 457.2 156.24)">DVP (B2B)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="838.8" y="158.4" transform="rotate(-0 838.8 158.4)">Companion (Python)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(789.629375 172.557813)">quality &gt; localise &gt; OCR</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(792.459375 182.16)">&gt; rejection &gt; guidance</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6a1b9a" x="738" y="153.36" transform="rotate(-0 738 153.36)">HTTP</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="21.6" y="14.4" transform="rotate(-0 21.6 14.4)">Camera and optical sensing schematic (PROPOSED design, not built, not simulated)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(21.6 75.795496)">Status: design estimate only. Wokwi cannot simulate a camera, so experiments use synthetic images in place of this sensor.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(21.6 86.117848)">Proposed module: OV5640 AF (the vendor says kits may ship with an OV5640 or OV3660, so the fitted module is unconfirmed); no field of view or minimum focus distance is listed, so they cannot be</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(21.6 96.440199)">estimated here. The cone and the 23 mm figure below use OV2640 numbers (Arducam page: 1600x1200, fixed focus, EFL 4.22 mm, 52 deg diagonal FOV) as an illustrative PLACEHOLDER, not OV5640 values,</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(21.6 106.762551)">and all optical values are estimates; macro focus must be measured on the delivered module (refocus, or add a close-up lens) before any build.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(21.6 117.084902)">Fallback architecture: USB macro camera on the companion computer (no image transfer from the wrist unit).</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="21.6" y="507.6" transform="rotate(-0 21.6 507.6)">Example: a 1.5 mm character is ≈ 103 px tall at d = 30 mm; the synthetic images used in the experiments are 640x400 px, i.e. a lower resolution than this design.</text>
   </g>
  </g>
 </g>
