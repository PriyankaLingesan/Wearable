    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="230.4" y="248.570789" transform="rotate(-0 230.4 248.570789)">Capture + validation + pipeline. Tested with a test video file only; no physical webcam tested.</text>
